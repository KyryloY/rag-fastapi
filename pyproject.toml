[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "chromadb>=0.5.0",
  "google-genai>=1.0.0",
  "lingua-language-detector>=2.2.0",
]

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
